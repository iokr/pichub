openapi: 3.0.3
info:
  title: PicHub 后端服务 API
  version: 1.0.0
  description: |
    PicHub 自托管图床系统的后端 HTTP 接口定义，覆盖 REST API、图片直出与 S3 兼容网关。

    ## 统一响应
    除图片直出、健康检查与 S3 网关外，所有接口返回 `{ code, message, data }`：
    `code` 为业务错误码，`0` 表示成功；`data` 为业务数据，无数据时省略；每个响应都带 `X-Request-ID` 响应头。

    ## 认证
    需要登录的接口通过 `Authorization: Bearer <token>` 传递凭据，支持两类凭据：
    JWT 访问令牌（登录/注册/刷新接口返回，默认有效期 2 小时）与以 `ph_` 开头的 API 令牌
    （受 scope 限制，接口上以 `x-required-scope` 标注）。

    ## 限流
    基于 Redis 固定窗口实现，超限返回 `42900` 与 `Retry-After` 响应头。
    默认阈值：注册 10 次/小时（IP）、登录 10 次/分钟（IP）、上传 60 次/分钟（用户）、
    其他需登录接口 300 次/分钟（用户）、图片直出 600 次/分钟（IP）。
servers:
  - url: http://localhost:8080
    description: 本地默认地址，生产环境请替换为实际站点地址
tags:
  - name: 公共
    description: 健康检查与站点公开配置
  - name: 认证
    description: 注册、登录、令牌刷新与账号找回
  - name: 用户
    description: 当前用户资料、密码与用量
  - name: 上传
    description: 单图、秒传、远程拉取与分片上传
  - name: 图片
    description: 图片检索、编辑、回收站与引用统计
  - name: 相册
    description: 相册管理
  - name: 标签
    description: 标签管理
  - name: 令牌
    description: API 令牌与 S3 凭据
  - name: 分享
    description: 图片与相册分享
  - name: 存储
    description: 存储策略管理
  - name: 统计
    description: 引用来源统计
  - name: 管理端
    description: 管理员接口，需要 role=1
  - name: 图片直出
    description: 原图、缩略图与动态处理
  - name: S3 网关
    description: S3 兼容接口，使用 AWS Signature V4
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [公共]
      summary: 存活探针
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}

  /readyz:
    get:
      tags: [公共]
      summary: 就绪探针
      description: 检查数据库与 Redis 可用性。
      security: []
      responses:
        '200':
          description: 依赖就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ready}
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: unavailable}
                  error: {type: string}

  /api/v1/site:
    get:
      tags: [公共]
      summary: 站点公开配置
      description: 前端初始化站点名称、注册开关、验证码开关、上传限制等。
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteEnvelope'}

  /api/v1/auth/captcha:
    get:
      tags: [认证]
      summary: 获取图片验证码
      description: 验证码未启用时返回 `40001 验证码未启用`。
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptchaEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/register:
    post:
      tags: [认证]
      summary: 注册
      description: |
        注册关闭时返回 `40300 注册通道已关闭`；同一 IP 24 小时内注册数量受限（默认 3）。
        首个注册用户自动成为管理员；邮箱验证级别为 `force` 时账号初始状态为 `2`（待验证）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  description: "3-32 位，仅 [a-zA-Z0-9_-]，不能使用保留名"
                email: {type: string, format: email}
                password:
                  type: string
                  description: 默认至少 8 位且同时包含字母与数字
                captcha_id: {type: string, description: 验证码启用时必填}
                captcha_code: {type: string, description: 验证码启用时必填}
                invite_code: {type: string, description: 注册模式为 invite 时必填}
      responses:
        '200':
          description: 注册成功，直接返回登录态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 登录
      description: |
        同一 IP 连续失败达到 `security.login_max_fails`（默认 5）次后锁定 10 分钟并返回 `42900`；
        连续失败达到 `captcha.login_trigger_fails`（默认 2）次后要求验证码，缺失返回 `40020`；
        账号被禁用返回 `40300`；邮箱验证级别为 `force` 且未验证返回 `40301`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                account: {type: string, description: 用户名或邮箱，与 username 二选一}
                username: {type: string, description: 兼容字段，account 为空时使用}
                password: {type: string}
                captcha_id: {type: string, description: 失败达阈值后必填}
                captcha_code: {type: string, description: 失败达阈值后必填}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /api/v1/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新令牌
      description: 刷新令牌会轮换，旧令牌立即失效；过期返回 `40101`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/auth/check-username:
    get:
      tags: [认证]
      summary: 检查用户名可用性
      security: []
      parameters:
        - name: u
          in: query
          required: false
          description: 待检查用户名，也接受 username
          schema: {type: string}
        - name: username
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckEnvelope'}

  /api/v1/auth/check-email:
    get:
      tags: [认证]
      summary: 检查邮箱可用性
      security: []
      parameters:
        - name: e
          in: query
          required: false
          description: 待检查邮箱，也接受 email
          schema: {type: string}
        - name: email
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckEnvelope'}

  /api/v1/auth/verify-email:
    post:
      tags: [认证]
      summary: 验证邮箱（JSON）
      description: 验证成功后用户 `email_verified=true` 且状态置为正常；令牌无效或过期返回 `40001`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}
    get:
      tags: [认证]
      summary: 验证邮箱（查询参数）
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/resend-verify:
    post:
      tags: [认证]
      summary: 重发验证邮件
      description: 无论邮箱是否存在均返回成功，避免暴露账号信息。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                captcha_id: {type: string, description: 验证码启用时必填}
                captcha_code: {type: string, description: 验证码启用时必填}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/forgot-password:
    post:
      tags: [认证]
      summary: 忘记密码
      description: SMTP 未启用时返回 `40300 邮件服务未启用，请联系管理员`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                captcha_id: {type: string, description: 验证码启用时必填}
                captcha_code: {type: string, description: 验证码启用时必填}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/auth/reset-password:
    post:
      tags: [认证]
      summary: 重置密码
      description: 令牌无效或过期返回 `40001`；新密码需满足密码强度策略。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 登出
      description: 注销当前访问令牌；传入 refresh_token 时一并注销该刷新令牌。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/s/{slug}:
    get:
      tags: [分享]
      summary: 访问分享内容
      description: 公开接口；分享不存在/过期/次数用尽返回 `40400`，密码错误返回 `40300`。
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - name: password
          in: query
          required: false
          description: 分享密码，也接受表单字段 password
          schema: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareAccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/user/profile:
    get:
      tags: [用户]
      summary: 获取当前用户资料
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [用户]
      summary: 修改当前用户资料
      description: |
        字段均可选，仅传需要修改的字段。
        `referer_stat_enabled` 在配置禁止用户关闭时返回 `40300`；
        `storage_config_id` 为 `0` 表示解绑，未开放自定义存储时返回 `40300`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: {type: string, description: 昵称，1-32 字符}
                avatar_url: {type: string, maxLength: 500}
                default_visibility: {type: string, enum: [public, private]}
                referer_stat_enabled: {type: boolean}
                storage_config_id: {type: integer, format: int64, description: 绑定本人存储策略，0 表示解绑}
      responses:
        '200':
          description: 成功，返回更新后的用户信息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/user/password:
    put:
      tags: [用户]
      summary: 修改密码
      description: 需校验原密码与验证码；新密码需满足强度策略且不能与原密码相同。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: {type: string}
                new_password: {type: string}
                captcha_id: {type: string, description: 验证码启用时必填}
                captcha_code: {type: string, description: 验证码启用时必填}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseBase'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/user/stats:
    get:
      tags: [用户]
      summary: 获取用户用量统计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserStatsEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/upload:
    post:
      tags: [上传]
      summary: 上传单张图片
      description: |
        请求体上限为「单文件上限 + 1MB」，超过返回 `41300`；扩展名不在允许列表返回 `40001`。
        用户级秒传命中时 `dedup=true` 直接返回；`upload.dedup_scope=global` 时复用物理文件并累加引用计数。
        达到每日上传上限返回 `41302`，容量不足返回 `41301`。按用户限流（默认 60 次/分钟）。
      x-required-scope: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: 图片文件}
                album_id: {type: string, description: 归属相册 ID}
                tags: {type: string, description: '逗号分隔标签，如 旅行,风景'}
                is_public: {type: string, description: 是否公开，缺省取用户/系统默认可见性}
                storage_id: {type: string, description: 指定存储策略 ID}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /api/v1/upload/check:
    post:
      tags: [上传]
      summary: 秒传检测
      x-required-scope: upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash: {type: string, description: 文件 SHA-256，64 位十六进制}
                size: {type: integer, format: int64, description: 文件大小（字节）}
                name: {type: string}
                ext: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadCheckEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/upload/url:
    post:
      tags: [上传]
      summary: 远程 URL 拉取上传
      description: |
        仅支持 http/https，禁止内网地址与重定向；下载超时 30 秒，
        响应体超过单文件上限返回 `41300`。
      x-required-scope: upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
                album_id: {type: integer, format: int64, nullable: true}
                tags: {type: string, description: 逗号分隔标签}
                is_public: {type: boolean, nullable: true}
                storage_id: {type: integer, format: int64}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}

  /api/v1/upload/chunk/init:
    post:
      tags: [上传]
      summary: 初始化分片上传
      description: 分片会话保存在服务进程内，有效期 24 小时；服务重启后会话失效。
      x-required-scope: upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, hash, chunks]
              properties:
                name: {type: string, description: 文件名}
                size: {type: integer, format: int64, description: 文件总大小，需不超过单文件上限}
                hash: {type: string, description: 文件 SHA-256}
                chunks: {type: integer, description: 分片数量，1-upload.max_chunk_count（默认 1000）}
                album_id: {type: integer, format: int64, nullable: true}
                tags: {type: string}
                is_public: {type: boolean, nullable: true}
                storage_id: {type: integer, format: int64}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChunkInitEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}

  /api/v1/upload/chunk/{id}:
    post:
      tags: [上传]
      summary: 上传单个分片
      description: 除最后一片外单分片不得超过 `chunk_size`；空分片返回 `40001`。
      x-required-scope: upload
      parameters:
        - name: id
          in: path
          required: true
          description: 分片会话 ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                index: {type: string, description: 分片序号，从 0 开始；也接受 part、part_number、partNumber}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          index: {type: integer, example: 0}
                          size: {type: integer, format: int64, example: 5242880}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/upload/chunk/{id}/complete:
    post:
      tags: [上传]
      summary: 完成分片上传
      description: 校验所有分片齐全、合并后大小与哈希与初始化一致；会话不存在或过期返回 `40400`。
      x-required-scope: upload
      parameters:
        - name: id
          in: path
          required: true
          description: 分片会话 ID
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hash: {type: string, description: 文件 SHA-256，仅作兼容保留，服务端以会话记录为准}
      responses:
        '200':
