        - name: album_id
          in: query
          schema: {type: integer, format: int64}
        - name: tag_id
          in: query
          schema: {type: integer, format: int64}
        - name: ext
          in: query
          schema: {type: string}
          description: 扩展名，如 png（自动去点、转小写）
        - name: referred
          in: query
          schema: {type: boolean}
          description: 仅返回存在引用记录的图片
        - name: is_public
          in: query
          schema: {type: boolean}
        - name: trash
          in: query
          schema: {type: boolean}
        - name: with_tags
          in: query
          schema: {type: string, enum: ['1', 'true']}
          description: 为每张图片附带标签列表
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, default: 24, maximum: 200}
