  /i/{hash}:
    get:
      tags: [图片直出]
      summary: 原图与动态处理
      description: |
        直接输出图片二进制，按 IP 限流（默认 600 次/分钟）。

        任一动态参数存在时走处理链路：默认不放大；源图解码像素超过 1 亿或源文件超过 256MB 返回 41300；
        SVG 不支持动态处理（40001）；处理结果按「源图 + 参数」磁盘缓存。

        私有图片需要签名：`sign = hex(HMAC-SHA256(secret, hash + ":" + exp))`，
        `secret` 取 `security.url_sign_secret`，为空时回退 `security.jwt_secret`。
        公开图片无需签名；私有图片非本人访问且签名缺失/过期/不匹配返回 40300。

        防盗链开启时校验 Referer：空 Referer 依 `allow_empty_referer` 决定；同站域名与白名单放行；
        拒绝时按 `block_action` 返回 403（forbidden）或 302 跳转站点首页（默认 redirect）。
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          description: 图片 SHA-256，可带扩展名（如 <hash>.png）
          schema: {type: string}
        - name: w
          in: query
          schema: {type: integer, maximum: 4096}
          description: 目标宽度，超过 max_width 时截断
        - name: h
          in: query
          schema: {type: integer, maximum: 4096}
          description: 目标高度，超过 max_height 时截断
        - name: fit
          in: query
          schema: {type: string, enum: [cover, contain, fill, inside, outside], default: inside}
        - name: q
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 85}
          description: 输出质量
        - name: format
          in: query
          schema: {type: string, enum: [webp, jpeg, png, avif]}
          description: 输出格式，需在 allowed_formats 内
        - name: blur
          in: query
          schema: {type: number, minimum: 0, maximum: 100}
          description: 模糊程度，内部换算为 sigma（0.3-20）
        - name: gray
          in: query
          schema: {type: string, enum: ['1', 'true', 'yes']}
          description: 输出灰度图
        - name: uid
          in: query
          schema: {type: integer, format: int64}
          description: 图片所属用户 ID，与归属一致时视为本人访问
        - name: exp
          in: query
          schema: {type: integer, format: int64}
          description: 签名过期时间戳（Unix 秒）
        - name: sign
          in: query
          schema: {type: string}
          description: 签名值
      responses:
        '200':
          description: 图片二进制
          headers:
            ETag:
              description: 原图为 "<hash>"，处理图为 "<hash>|<参数键>"
              schema: {type: string}
            Cache-Control:
              description: 公开原图 public, max-age=31536000, immutable；私有原图 private, max-age=3600；处理图 public, max-age=604800
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, example: nosniff}
          content:
            image/*:
              schema: {type: string, format: binary}
        '302':
          description: 防盗链命中且 block_action 为 redirect
        '304':
          description: If-None-Match 命中
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}

  /t/{hash}/{size}:
    get:
      tags: [图片直出]
      summary: 预设缩略图
      description: |
        缩略图未启用返回 40400，未知尺寸返回 40001；
        输出格式取 `image.thumbnail.format`（默认 webp）。
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          description: 图片 SHA-256，可带扩展名
          schema: {type: string}
        - name: size
          in: path
          required: true
          description: 预设尺寸名（small/medium/large）或像素宽度（如 800），可带扩展名
          schema: {type: string}
      responses:
        '200':
          description: 缩略图二进制
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=604800'}
          content:
            image/*:
              schema: {type: string, format: binary}
        '304':
          description: If-None-Match 命中
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /s3:
    get:
      tags: [S3 网关]
      summary: ListBuckets
      description: |
        S3 兼容网关，前缀由 `s3_gateway.path_prefix` 决定（默认 /s3），关闭时返回 503 ServiceUnavailable。
        使用 AWS Signature V4 鉴权（Authorization 头或 X-Amz-Signature 查询参数），凭据在「API 令牌 → S3 凭据」创建，
        必须使用 Path Style 访问。Bucket 固定返回 pichub。
      security: []
      responses:
        '200':
          description: Bucket 列表 XML
          content:
            application/xml:
              schema: {type: string}
        '503':
          description: 网关已关闭
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}

  /s3/{bucket}:
    head:
      tags: [S3 网关]
      summary: HeadBucket
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
      responses:
        '200':
          description: 存在，响应头包含 x-amz-bucket-region
          headers:
            x-amz-bucket-region:
              schema: {type: string}
        '403':
          description: 签名无效或无权限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
    get:
      tags: [S3 网关]
      summary: GetBucketLocation / ListObjectsV2
      description: 带 `location` 查询参数时返回 Bucket Region，否则执行 ListObjectsV2。
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - name: location
          in: query
          schema: {type: string}
        - name: prefix
          in: query
          schema: {type: string}
        - name: delimiter
          in: query
          schema: {type: string}
        - name: max-keys
          in: query
          schema: {type: integer, maximum: 1000}
        - name: continuation-token
          in: query
          schema: {type: string}
      responses:
        '200':
          description: XML 结果
          content:
            application/xml:
              schema: {type: string}
        '403':
          description: 签名无效或无权限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}

  /s3/{bucket}/{key}:
    get:
      tags: [S3 网关]
      summary: GetObject
      description: |
        支持 Range 断点续传。匿名请求（无 Authorization 且无 X-Amz-Signature）仅允许访问公开图片，
        便于 PicGo 自定义域名直链；对象直链为 `<site_url>/s3/pichub/<key>`。
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - $ref: '#/components/parameters/S3Key'
        - name: Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: 对象内容
          headers:
            ETag:
              schema: {type: string}
            Content-Type:
              schema: {type: string}
            Content-Length:
              schema: {type: integer}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Range 命中
        '403':
          description: 无权限或私有对象
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '404':
          description: 对象不存在
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
    head:
      tags: [S3 网关]
      summary: HeadObject
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - $ref: '#/components/parameters/S3Key'
      responses:
        '200':
          description: 对象元信息
          headers:
            Content-Length:
              schema: {type: integer}
            ETag:
              schema: {type: string}
            Content-Type:
              schema: {type: string}
        '404':
          description: 对象不存在
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
    put:
      tags: [S3 网关]
      summary: PutObject / UploadPart
      description: |
        带 `uploadId` 与 `partNumber` 时执行 UploadPart（partNumber 取值 1-10000），否则执行 PutObject。
        会校验请求体 `x-amz-content-sha256`（若提供），并按用户单文件上限限制大小；
        写入复用图片表，内容相同的 Key 做记录迁移，相同内容重复上传视为秒传。
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - $ref: '#/components/parameters/S3Key'
        - name: uploadId
          in: query
          schema: {type: string}
        - name: partNumber
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: 成功，响应头 ETag
          headers:
            ETag:
              schema: {type: string}
        '400':
          description: 参数错误或哈希不一致
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '403':
          description: 配额不足或无权限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '413':
          description: 对象大小超限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '503':
          description: 每日上传数超限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
    post:
      tags: [S3 网关]
      summary: CreateMultipartUpload / CompleteMultipartUpload
      description: 带 `uploads` 查询参数时创建分片上传（需 allow_multipart=true），带 `uploadId` 时完成合并。
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - $ref: '#/components/parameters/S3Key'
        - name: uploads
          in: query
          schema: {type: string}
        - name: uploadId
          in: query
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              type: object
              properties:
                CompleteMultipartUpload:
                  type: object
                  description: 标准 CompleteMultipartUpload 文档
      responses:
        '200':
          description: XML 结果（创建返回 UploadId，完成返回 Location/ETag）
          content:
            application/xml:
              schema: {type: string}
        '400':
          description: XML 不合法或参数错误
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '404':
          description: 分片会话不存在
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '501':
          description: 未开启分片上传
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
    delete:
      tags: [S3 网关]
      summary: DeleteObject / AbortMultipartUpload
      description: |
        不带 `uploadId` 时删除对象（等于把对应图片移入回收站），对象不存在同样返回 204；
        带 `uploadId` 时中止分片上传。
      security: []
      parameters:
        - $ref: '#/components/parameters/S3Bucket'
        - $ref: '#/components/parameters/S3Key'
        - name: uploadId
          in: query
          schema: {type: string}
      responses:
        '204':
          description: 成功
        '403':
          description: 无权限
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}
        '404':
          description: 分片会话不存在
          content:
            application/xml:
              schema: {$ref: '#/components/schemas/S3Error'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 访问令牌（登录/注册/刷新返回）或 API 令牌（以 ph_ 开头）。
        访问令牌失效返回 40101（过期）或 401（注销/用户禁用）。

  parameters:
    PathID:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema: {type: integer, format: int64, minimum: 1}
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标模式，只返回 id < cursor 的记录，此时忽略 page 且不统计 total
      schema: {type: integer, format: int64}
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema: {type: integer, default: 1, minimum: 1}
    S3Bucket:
      name: bucket
      in: path
      required: true
      description: 逻辑 Bucket 名称，固定为 pichub；3-63 位，仅小写字母、数字、- 与 .，首尾不能为符号
      schema: {type: string}
    S3Key:
      name: key
      in: path
      required: true
      description: 对象 Key
      schema: {type: string}

  responses:
    BadRequest:
      description: 参数错误（40001）或验证码/邀请码等业务校验失败
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: 未登录、凭据无效（40100）或令牌过期（40101）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: 无权限（40300）、scope 不足、邮箱未验证（40301 / 40302）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: 资源不存在或无权访问（40400）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: 资源冲突（40010 用户名已占用 / 40011 邮箱已注册）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: 文件超限（41300）、容量配额超限（41301）或每日上传数超限（41302）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: 触发限流或登录失败锁定（42900），响应头含 Retry-After
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Internal:
      description: 服务端异常（50000）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:
    ResponseBase:
      type: object
      description: 统一响应结构，data 无内容时省略
      required: [code, message]
      properties:
        code: {type: integer, description: 业务错误码，0 表示成功, example: 0}
        message: {type: string, description: 提示信息, example: ok}

    ErrorEnvelope:
      type: object
      description: 统一错误响应
      required: [code, message]
      properties:
        code: {type: integer, example: 40100}
        message: {type: string, example: 未登录}
        data:
          type: object
          description: 附加数据，限流时为当前窗口计数
          additionalProperties: true
          example: {count: 11}

    User:
      type: object
      description: 用户信息（UserResp）
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        email: {type: string}
        nickname: {type: string}
        avatar_url: {type: string}
        role: {type: integer, description: 0 普通用户，1 管理员}
        status: {type: integer, description: 0 禁用，1 正常，2 待邮箱验证}
        email_verified: {type: boolean}
        group_id: {type: integer, format: int64}
        quota_bytes: {type: integer, format: int64}
        used_bytes: {type: integer, format: int64}
        max_file_size: {type: integer, format: int64}
        daily_limit: {type: integer, description: 每日上传上限，0 表示不限}
        default_visibility: {type: string, enum: [public, private]}
        storage_config_id: {type: integer, format: int64, nullable: true, description: 绑定的存储策略，null 表示未绑定}
        referer_stat_enabled: {type: boolean}
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    AdminUser:
      type: object
      description: 管理端用户视图（AdminUserResp），在 User 基础上增加 IP 字段，不含 default_visibility 与 storage_config_id
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        email: {type: string}
        nickname: {type: string}
        avatar_url: {type: string}
        role: {type: integer}
        status: {type: integer}
        email_verified: {type: boolean}
        group_id: {type: integer, format: int64}
        quota_bytes: {type: integer, format: int64}
        used_bytes: {type: integer, format: int64}
        max_file_size: {type: integer, format: int64}
        daily_limit: {type: integer}
        referer_stat_enabled: {type: boolean}
        register_ip: {type: string}
        last_login_ip: {type: string}
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    Auth:
      type: object
      description: 登录/注册/刷新响应（AuthResp）
      properties:
        access_token: {type: string, description: JWT 访问令牌}
        refresh_token: {type: string, description: 刷新令牌，每次刷新轮换}
        expires_in: {type: integer, format: int64, description: 访问令牌有效期（秒）}
        user: {$ref: '#/components/schemas/User'}

    Captcha:
      type: object
      description: 验证码响应（CaptchaResp）
      properties:
        captcha_id: {type: string}
        image_base64: {type: string, description: 验证码图片 Base64}
        expires_in: {type: integer, description: 有效期（秒），默认 300}

    CheckResult:
      type: object
      description: 可用性检查结果（CheckResp）
      properties:
        available: {type: boolean}
        message: {type: string}

    UserStats:
      type: object
      description: 用户用量统计（UserStatsResp）
      properties:
        image_count: {type: integer, format: int64, description: 正常图片数量}
        album_count: {type: integer, format: int64}
        share_count: {type: integer, format: int64}
        trash_count: {type: integer, format: int64, description: 回收站图片数量}
        storage_bytes: {type: integer, format: int64, description: 正常图片占用字节数}
        used_bytes: {type: integer, format: int64}
        quota_bytes: {type: integer, format: int64}
        daily_limit: {type: integer}
        today_uploads: {type: integer}
        referer_hits: {type: integer, format: int64}
        top_hosts:
          type: array
          items: {$ref: '#/components/schemas/HostStat'}
        trend:
          type: array
          items: {$ref: '#/components/schemas/DayStat'}

    SiteConfig:
      type: object
      description: 站点公开配置（SiteConfigResp）
      properties:
        name: {type: string}
        description: {type: string}
        logo_url: {type: string}
        icp: {type: string}
        site_url: {type: string}
        register_enabled: {type: boolean}
        register_mode: {type: string, enum: [open, invite]}
        email_verify_level: {type: string, enum: [off, soft, force], description: 未配置 SMTP 时 force 自动降级为 soft}
        captcha_enabled: {type: boolean}
        default_visibility: {type: string, enum: [public, private]}
        max_file_size: {type: integer, format: int64}
        allowed_extensions:
          type: array
          items: {type: string}
        thumbnail_enabled: {type: boolean}
        thumbnail_sizes:
          type: array
          items: {type: string}
        s3_gateway_enabled: {type: boolean}
        s3_gateway_prefix: {type: string, example: /s3}

    Upload:
      type: object
      description: 上传成功响应（UploadResp，PicGo 兼容）
      properties:
        id: {type: integer, format: int64}
        url: {type: string}
        thumb_url: {type: string, description: 未启用缩略图时为空}
        markdown: {type: string}
        html: {type: string}
        bbcode: {type: string}
        size: {type: integer, format: int64}
        width: {type: integer, description: 无法解析时为 0}
        height: {type: integer, description: 无法解析时为 0}
        hash: {type: string, description: SHA-256 十六进制摘要}
        dedup: {type: boolean, description: 是否命中秒传}

    UploadCheck:
      type: object
      description: 秒传检测结果（UploadCheckResp）
      properties:
        exists: {type: boolean}
        image: {$ref: '#/components/schemas/Upload'}

    ChunkInit:
      type: object
      description: 分片上传初始化结果（ChunkInitResp）
      properties:
        upload_id: {type: string}
        uploaded:
          type: array
          items: {type: integer}
          description: 已上传分片序号，新建时为空数组
        chunk_size: {type: integer, format: int64, description: 建议分片大小（字节），默认 5MB}

    Image:
      type: object
      description: 图片信息（ImageResp）
      properties:
        id: {type: integer, format: int64}
        hash: {type: string, description: SHA-256}
        name: {type: string, description: 显示名称}
        origin_name: {type: string, description: 原始文件名}
        ext: {type: string, description: 扩展名，不含点}
        mime: {type: string}
        size: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        url: {type: string, description: 访问地址，本地存储由站点地址派生}
        thumb_url: {type: string, description: 未启用缩略图时为空}
        is_public: {type: boolean}
        album_id: {type: integer, format: int64, nullable: true}
        tags:
          type: array
          items: {$ref: '#/components/schemas/Tag'}
          description: 仅详情或 with_tags 时返回
        ref_count: {type: integer, description: 物理文件被引用次数}
        status: {type: integer, description: 0 回收站，1 正常}
        created_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time, nullable: true, description: 移入回收站时间}

    Album:
      type: object
      description: 相册信息（AlbumResp）
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string}
        cover_image_id: {type: integer, format: int64, nullable: true}
        cover_url: {type: string, description: 预留字段，当前恒为空字符串}
        is_public: {type: boolean}
        sort_order: {type: integer}
        image_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Tag:
      type: object
      description: 标签信息（TagResp）
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        color: {type: string}
        image_count: {type: integer}
        created_at: {type: string, format: date-time}

    Token:
      type: object
      description: API 令牌（TokenResp）
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        prefix: {type: string, description: 令牌前缀，用于辨识}
        scopes:
          type: array
          items: {type: string}
        expires_at: {type: string, format: date-time, nullable: true, description: null 表示永久}
        last_used_at: {type: string, format: date-time, nullable: true}
        call_count: {type: integer, format: int64}
        status: {type: integer, description: 0 禁用，1 启用}
        created_at: {type: string, format: date-time}

    TokenCreate:
      type: object
      description: 创建令牌响应（TokenCreateResp），明文仅返回一次
      properties:
        token: {type: string}
        info: {$ref: '#/components/schemas/Token'}

    S3Cred:
      type: object
      description: S3 凭据（S3CredResp）
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        access_key: {type: string}
        call_count: {type: integer, format: int64}
        last_used_at: {type: string, format: date-time, nullable: true}
        status: {type: integer}
        created_at: {type: string, format: date-time}

    S3CredCreate:
      type: object
      description: 创建 S3 凭据响应（S3CredCreateResp），SecretKey 仅返回一次
      properties:
        access_key: {type: string}
        secret_key: {type: string}
        info: {$ref: '#/components/schemas/S3Cred'}

    Share:
      type: object
      description: 分享信息（ShareResp）
      properties:
        id: {type: integer, format: int64}
        slug: {type: string, description: 短链接标识}
        target_type: {type: string, enum: [image, album]}
        target_id: {type: integer, format: int64}
        has_password: {type: boolean}
        expires_at: {type: string, format: date-time, nullable: true}
        max_views: {type: integer, description: 0 不限}
        views: {type: integer}
        status: {type: integer, description: 0 失效，1 正常}
        url: {type: string, description: 分享完整地址}
        created_at: {type: string, format: date-time}

    ShareAccess:
      type: object
      description: 分享内容（ShareAccessResp）
      properties:
        share: {$ref: '#/components/schemas/Share'}
        album: {$ref: '#/components/schemas/Album'}
        images:
          type: array
          items: {$ref: '#/components/schemas/Image'}

    Storage:
      type: object
      description: 存储策略（StorageResp），不返回密钥明文
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64, nullable: true, description: null 表示系统级策略}
        name: {type: string}
        driver: {type: string, enum: [local, s3, oss, cos, webdav]}
        domain: {type: string, description: 自定义访问域名}
        path_prefix: {type: string}
        is_default: {type: boolean}
        status: {type: integer, description: 0 禁用，1 启用}
        root_path: {type: string, description: 本地存储根目录}
        path_template: {type: string, description: 对象 Key 模板}
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        path_style: {type: boolean}
        use_ssl: {type: boolean, nullable: true}
        public_url: {type: string}
        url: {type: string, description: WebDAV 地址}
        has_secret: {type: boolean}
        last_test_at: {type: string, format: date-time, nullable: true}
        last_test_ok: {type: boolean, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    StorageTest:
      type: object
      description: 存储连通性测试结果（StorageTestResp）
      properties:
        ok: {type: boolean}
        message: {type: string}

    Referer:
      type: object
      description: 单条引用来源（RefererResp）
      properties:
        id: {type: integer, format: int64}
        host: {type: string}
        url: {type: string}
        hits: {type: integer, format: int64}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    RefererSummary:
      type: object
      description: 单图引用汇总（RefererSummaryResp）
      properties:
        total_hits: {type: integer, format: int64}
        host_count: {type: integer, format: int64}

    HostStat:
      type: object
      description: 域名汇总统计
      properties:
        host: {type: string, description: 来源域名}
        hits: {type: integer, format: int64}
        images: {type: integer, format: int64, description: 涉及图片数}

    DayStat:
      type: object
      description: 按天统计
      properties:
        date: {type: string, description: 日期，格式 YYYY-MM-DD, example: '2026-10-24'}
        hits: {type: integer, format: int64}

    Dashboard:
      type: object
      description: 管理后台仪表盘（DashboardResp）
      properties:
        user_count: {type: integer, format: int64}
        image_count: {type: integer, format: int64}
        storage_bytes: {type: integer, format: int64}
        today_uploads: {type: integer, format: int64}
        referer_hits: {type: integer, format: int64}
        album_count: {type: integer, format: int64}
        share_count: {type: integer, format: int64}
        trash_count: {type: integer, format: int64}
        group_count: {type: integer, format: int64}
        invite_count: {type: integer, format: int64}
        queue_ready: {type: integer, format: int64, description: 待处理队列任务数}
        queue_delayed: {type: integer, format: int64, description: 延迟队列任务数}
        queue_dead: {type: integer, format: int64, description: 死信队列任务数}

    Group:
      type: object
      description: 用户组（GroupResp）
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string}
        quota_bytes: {type: integer, format: int64}
        max_file_size: {type: integer, format: int64}
        daily_limit: {type: integer}
        max_albums: {type: integer}
        max_tokens: {type: integer}
        max_shares: {type: integer}
        allow_register: {type: boolean}
        allow_custom_storage: {type: boolean}
        is_default: {type: boolean}
        status: {type: integer}
        user_count: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Setting:
      type: object
      description: 系统设置项（SettingResp）
      properties:
        key: {type: string}
        value: {type: string, description: 密文项返回掩码值}
        type: {type: string, description: 值类型，如 string / int / bool / json}
        is_secret: {type: boolean}
        description: {type: string}
        updated_at: {type: string, format: date-time}

    Log:
      type: object
      description: 操作日志（LogResp）
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: integer, format: int64}
        ip: {type: string}
        user_agent: {type: string}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    EmailLog:
      type: object
      description: 邮件日志（EmailLogResp）
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        to_email: {type: string}
        subject: {type: string}
        template: {type: string}
        status: {type: integer, description: 0 待发送，1 成功，2 失败}
        error: {type: string}
        retry: {type: integer}
        sent_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    Invite:
      type: object
      description: 邀请码（InviteResp）
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        creator_id: {type: integer, format: int64}
        max_uses: {type: integer}
        used_count: {type: integer}
        group_id: {type: integer, format: int64}
        expires_at: {type: string, format: date-time, nullable: true}
        status: {type: integer}
        created_at: {type: string, format: date-time}

    S3Error:
      type: object
      description: S3 网关错误体（XML）
      properties:
        Code: {type: string, example: NoSuchKey}
        Message: {type: string, example: 对象不存在}
        RequestId: {type: string}
        HostId: {type: string, example: PicHub}

    StorageCreateReq:
      type: object
      description: 创建存储策略请求（StorageCreateReq）
      required: [name, driver]
      properties:
        name: {type: string}
        driver: {type: string, enum: [local, s3, oss, cos, webdav]}
        domain: {type: string, description: 自定义访问域名}
        path_prefix: {type: string}
        is_default: {type: boolean}
        status: {type: integer, enum: [0, 1], description: 缺省启用}
        root_path: {type: string, description: local 驱动根目录}
        path_template: {type: string, example: '{prefix}/{yyyy}/{MM}/{dd}/{hash}.{ext}'}
        endpoint: {type: string, description: s3 / oss / cos 端点}
        region: {type: string}
        bucket: {type: string}
        path_style: {type: boolean}
        use_ssl: {type: boolean, nullable: true}
        public_url: {type: string}
        url: {type: string, description: webdav 地址}
        access_key: {type: string}
        secret_key: {type: string, description: 仅写入，不返回}
        username: {type: string, description: webdav 用户名}
        password: {type: string, description: 仅写入，不返回}

    StorageUpdateReq:
      type: object
      description: 更新存储策略请求（StorageUpdateReq），字段均可选，仅传需要修改的字段
      properties:
        name: {type: string}
        domain: {type: string}
        path_prefix: {type: string}
        is_default: {type: boolean}
        status: {type: integer}
        root_path: {type: string}
        path_template: {type: string}
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        path_style: {type: boolean}
        use_ssl: {type: boolean}
        public_url: {type: string}
        url: {type: string}
        access_key: {type: string}
        secret_key: {type: string}
        username: {type: string}
        password: {type: string}

    GroupCreateReq:
      type: object
      description: 创建用户组请求（GroupCreateReq）
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        quota_bytes: {type: integer, format: int64}
        max_file_size: {type: integer, format: int64}
        daily_limit: {type: integer}
        max_albums: {type: integer}
        max_tokens: {type: integer}
        max_shares: {type: integer}
        allow_register: {type: boolean, nullable: true}
        allow_custom_storage: {type: boolean, nullable: true}
        is_default: {type: boolean}
        status: {type: integer, enum: [0, 1], nullable: true}

    GroupUpdateReq:
      type: object
      description: 更新用户组请求（GroupUpdateReq），字段均可选
      properties:
        name: {type: string}
        description: {type: string}
        quota_bytes: {type: integer, format: int64}
        max_file_size: {type: integer, format: int64}
        daily_limit: {type: integer}
        max_albums: {type: integer}
        max_tokens: {type: integer}
        max_shares: {type: integer}
        allow_register: {type: boolean}
        allow_custom_storage: {type: boolean}
        is_default: {type: boolean}
        status: {type: integer}

    SiteEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SiteConfig'}

    CaptchaEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Captcha'}

    AuthEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Auth'}

    CheckEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CheckResult'}

    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/User'}

    UserStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/UserStats'}

    UploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Upload'}

    UploadCheckEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/UploadCheck'}

    ChunkInitEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ChunkInit'}

    BatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                affected: {type: integer, description: 受影响记录数}

    ImageEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Image'}

    ImagePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items: {$ref: '#/components/schemas/Image'}
                total: {type: integer, format: int64, description: 游标模式下为 0}
                cursor: {type: integer, format: int64, description: 下一页游标，仅游标模式返回}
                size: {type: integer, description: 每页条数，请求未传时可能省略}

    RefererPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            data:
              type: object
